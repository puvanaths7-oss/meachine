<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ chatbot_title }}</title>
    <style>
        :root {
            --bg: #0b1020;
            --panel: rgba(17, 25, 48, .92);
            --soft: rgba(255, 255, 255, .06);
            --border: rgba(255, 255, 255, .1);
            --text: #f4f7ff;
            --muted: #9da8c3;
            --accent: #7c5cff;
            --accent2: #25d0ab;
            --user: #2445a5;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            color: var(--text);
            font-family: Inter, system-ui, sans-serif;
            background:
                radial-gradient(circle at 10% 10%, rgba(124,92,255,.22), transparent 30%),
                radial-gradient(circle at 90% 90%, rgba(37,208,171,.14), transparent 28%),
                var(--bg);
        }
        .app {
            width: min(960px, 100%);
            height: min(760px, 92vh);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 26px;
            box-shadow: 0 30px 80px rgba(0,0,0,.35);
            backdrop-filter: blur(18px);
        }
        header {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 20px 22px;
            border-bottom: 1px solid var(--border);
        }
        .logo {
            width: 46px;
            height: 46px;
            display: grid;
            place-items: center;
            border-radius: 15px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            font-weight: 800;
        }
        h1 { font-size: 18px; }
        header p { margin-top: 4px; color: var(--muted); font-size: 13px; }
        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .message {
            max-width: 82%;
            padding: 13px 16px;
            border-radius: 18px;
            line-height: 1.55;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }
        .bot {
            align-self: flex-start;
            background: var(--soft);
            border: 1px solid var(--border);
            border-bottom-left-radius: 5px;
        }
        .user {
            align-self: flex-end;
            background: var(--user);
            border-bottom-right-radius: 5px;
        }
        .error {
            background: rgba(255,107,122,.1);
            border-color: rgba(255,107,122,.3);
        }
        .typing { display: inline-flex; gap: 5px; width: fit-content; }
        .typing span {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--muted);
            animation: bounce 1s infinite ease-in-out;
        }
        .typing span:nth-child(2) { animation-delay: .15s; }
        .typing span:nth-child(3) { animation-delay: .3s; }
        @keyframes bounce {
            0%,60%,100% { transform: translateY(0); opacity: .5; }
            30% { transform: translateY(-5px); opacity: 1; }
        }
        form {
            display: flex;
            gap: 10px;
            padding: 18px;
            border-top: 1px solid var(--border);
        }
        textarea {
            flex: 1;
            min-height: 52px;
            max-height: 130px;
            resize: vertical;
            padding: 15px 16px;
            border: 1px solid var(--border);
            border-radius: 16px;
            outline: none;
            color: var(--text);
            background: rgba(255,255,255,.05);
            font: inherit;
        }
        textarea:focus { border-color: rgba(124,92,255,.65); }
        button {
            min-width: 100px;
            border: 0;
            border-radius: 16px;
            color: white;
            background: linear-gradient(135deg, var(--accent), #5d45d8);
            font-weight: 700;
            cursor: pointer;
        }
        button:disabled { opacity: .55; cursor: not-allowed; }
        @media (max-width: 640px) {
            body { padding: 0; }
            .app { height: 100vh; border-radius: 0; border: 0; }
            #chat { padding: 18px; }
            .message { max-width: 90%; }
            form { padding: 12px; }
            button { min-width: 76px; }
        }
    </style>
</head>
<body>
    <main class="app">
        <header>
            <div class="logo">AI</div>
            <div>
                <h1>{{ chatbot_title }}</h1>
                <p>Study-focused Gemini assistant</p>
            </div>
        </header>

        <section id="chat" aria-live="polite">
            <div class="message bot">
                Hello! I am {{ chatbot_title }}. Ask me a study question related to this topic.
            </div>
        </section>

        <form id="chat-form">
            <textarea id="message" placeholder="Ask a study question..." required></textarea>
            <button id="send-button" type="submit">Send</button>
        </form>
    </main>

    <script>
        const form = document.getElementById("chat-form");
        const input = document.getElementById("message");
        const chat = document.getElementById("chat");
        const sendButton = document.getElementById("send-button");

        function addMessage(text, type = "bot", extra = "") {
            const el = document.createElement("div");
            el.className = `message ${type} ${extra}`;
            el.textContent = text;
            chat.appendChild(el);
            chat.scrollTop = chat.scrollHeight;
        }

        function typing() {
            const el = document.createElement("div");
            el.className = "message bot typing";
            el.innerHTML = "<span></span><span></span><span></span>";
            chat.appendChild(el);
            chat.scrollTop = chat.scrollHeight;
            return el;
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            const message = input.value.trim();
            if (!message) return;

            addMessage(message, "user");
            input.value = "";
            sendButton.disabled = true;
            const loader = typing();

            try {
                const response = await fetch("/chat", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({message})
                });

                const data = await response.json();
                loader.remove();

                if (!response.ok) {
                    addMessage(data.error || "Something went wrong.", "bot", "error");
                    return;
                }

                addMessage(data.response || "No response received.");
            } catch {
                loader.remove();
                addMessage(
                    "Unable to connect to the chatbot. Please check the server and try again.",
                    "bot",
                    "error"
                );
            } finally {
                sendButton.disabled = false;
                input.focus();
            }
        });

        input.addEventListener("keydown", (event) => {
            if (event.key === "Enter" && !event.shiftKey) {
                event.preventDefault();
                form.requestSubmit();
            }
        });
    </script>
</body>
</html>
